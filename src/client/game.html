<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
    />
    <link rel="stylesheet" href="game.css" />
    <title>Share your dance</title>
  </head>

  <body>
    <div id="app">
      <header class="bar">
        <h1>Share your dance</h1>
        <span id="count" class="count" aria-label="Steps used">0/8</span>
      </header>

      <main id="game-container" aria-label="Clay dancer. Drag a body part to add a step."></main>

      <footer class="panel">
        <p id="hint" class="hint" aria-live="polite"></p>
        <ol id="steps" class="steps" aria-label="Dance steps"></ol>
        <div class="actions">
          <button id="undo" type="button">Undo</button>
          <button id="clear" type="button">Clear</button>
          <button id="play" type="button" class="primary">Play</button>
        </div>
      </footer>
    </div>
    <script type="module" src="game.ts"></script>
  </body>
</html>
